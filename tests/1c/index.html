<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Тесты по продуктам 1С — выберите тест для проверки знаний.">
  <meta name="theme-color" content="#090b12">
  <title>Тесты по продуктам 1С — Supermike888</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%235b8cff'/%3E%3Cstop offset='.5' stop-color='%238162ff'/%3E%3Cstop offset='1' stop-color='%2329d8c7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23090b12'/%3E%3Cpath d='M18 39c5 6 23 6 28-3 4-7-4-11-12-12-7-1-12-3-8-7 4-4 13-3 18 1' fill='none' stroke='url(%23g)' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --surface: rgba(21, 25, 39, 0.78);
      --surface-strong: rgba(26, 31, 48, 0.92);
      --text: #f4f7ff;
      --muted: #9da9c2;
      --blue: #5b8cff;
      --violet: #8162ff;
      --cyan: #29d8c7;
      --border: rgba(151, 168, 205, 0.16);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 84% 12%, rgba(129, 98, 255, 0.13), transparent 30rem),
        radial-gradient(circle at 12% 88%, rgba(41, 216, 199, 0.09), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
      content: "";
      pointer-events: none;
    }

    a { color: inherit; }

    .shell {
      width: min(1120px, calc(100% - 40px));
      min-height: 100vh;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(133, 149, 255, 0.35);
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(91, 140, 255, 0.18), rgba(129, 98, 255, 0.08));
      color: #aebdff;
      font-size: 0.78rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 24px rgba(91, 140, 255, 0.12);
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 180ms ease;
    }

    .home-link:hover { color: var(--text); }
    .home-link:focus-visible { outline: 3px solid var(--cyan); outline-offset: 6px; border-radius: 4px; }
    .home-link svg { width: 18px; height: 18px; transition: transform 180ms ease; }
    .home-link:hover svg { transform: translateX(-3px); }

    main {
      flex: 1;
      display: grid;
      align-content: center;
      gap: 40px;
      padding: 56px 0 72px;
    }

    .hero { max-width: 720px; }

    .eyebrow {
      margin: 0 0 17px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 4.5vw, 4.1rem);
      font-weight: 760;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .gradient-text {
      background: linear-gradient(105deg, #f7f9ff 5%, #9eb8ff 45%, #b69cff 70%, #62e5d8 100%);
      background-clip: text;
      color: transparent;
    }

    .intro {
      max-width: 620px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.125rem);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .test-card {
      --accent: var(--blue);
      position: relative;
      min-height: 248px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(145deg, var(--surface-strong), var(--surface));
      box-shadow: var(--shadow);
      text-decoration: none;
      isolation: isolate;
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .test-card:nth-child(2) { --accent: var(--violet); }

    .test-card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent 72%);
      content: "";
      opacity: 0.8;
    }

    .test-card::after {
      position: absolute;
      width: 180px;
      height: 180px;
      right: -76px;
      bottom: -94px;
      z-index: -1;
      border-radius: 50%;
      background: var(--accent);
      filter: blur(70px);
      opacity: 0.18;
      content: "";
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .test-card:hover {
      transform: translateY(-6px);
      border-color: color-mix(in srgb, var(--accent) 56%, transparent);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
    }

    .test-card:hover::after { opacity: 0.34; transform: scale(1.15); }
    .test-card:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .number {
      color: var(--accent);
      font: 700 0.82rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.1em;
    }

    .version {
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: #b9c3d9;
      font-size: 0.76rem;
      font-weight: 650;
      letter-spacing: 0.03em;
    }

    .test-card h2 {
      margin: 34px 0 10px;
      font-size: clamp(1.6rem, 3vw, 2rem);
      letter-spacing: -0.035em;
    }

    .meta {
      display: flex;
      align-items: center;
      min-height: 26px;
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .meta-dot {
      width: 6px;
      height: 6px;
      margin-right: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
    }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: auto;
      padding-top: 30px;
      color: #e3e8f8;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .card-action svg { width: 20px; height: 20px; transition: transform 220ms ease; }
    .test-card:hover .card-action svg { transform: translateX(4px); }

    footer {
      padding: 20px 0 24px;
      border-top: 1px solid var(--border);
      color: #78849d;
      font-size: 0.8rem;
    }

    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1120px); }
      .topbar { min-height: 64px; }
      .brand > span:last-child { display: none; }
      main { gap: 32px; padding: 42px 0 54px; }
      h1 { font-size: clamp(2.25rem, 9.5vw, 2.55rem); line-height: 1.02; }
      .intro { margin-top: 18px; font-size: 1rem; }
      .card-grid { grid-template-columns: 1fr; }
      .test-card { min-height: 220px; padding: 22px; border-radius: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Supermike888 — главная страница">
        <span class="brand-mark" aria-hidden="true">S8</span>
        <span>Supermike888</span>
      </a>
      <a class="home-link" href="/">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        На главную
      </a>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Проверка знаний</p>
        <h1 id="page-title">Тесты по <span class="gradient-text">продуктам 1С</span></h1>
        <p class="intro">Выберите тест и проверьте свои знания в удобном темпе.</p>
      </section>

      <nav class="card-grid" aria-label="Доступные тесты">
        <a class="test-card" href="/tests/1c/1/">
          <div class="card-head">
            <span class="number">ТЕСТ 01</span>
            <span class="version">Версия 1.2</span>
          </div>
          <h2>Тест №1</h2>
          <p class="meta"><span class="meta-dot" aria-hidden="true"></span>28 вопросов</p>
          <span class="card-action">Начать тест <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>

        <a class="test-card" href="/tests/1c/2/">
          <div class="card-head">
            <span class="number">ТЕСТ 02</span>
            <span class="version">Версия 2.2</span>
          </div>
          <h2>Тест №2</h2>
          <p class="meta"><span class="meta-dot" aria-hidden="true"></span>28 вопросов</p>
          <span class="card-action">Начать тест <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
      </nav>
    </main>

    <footer>Supermike888 · Тесты 1С</footer>
  </div>
</body>
</html>
