<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Тест по 80 распространённым неправильным глаголам английского языка.">
  <meta name="theme-color" content="#090b12">
  <title>Неправильные глаголы — английский язык</title>
  <style>
    :root { color-scheme: dark; --bg:#090b12; --surface:rgba(18,22,35,.94); --surface-2:rgba(27,33,50,.9); --text:#f4f7ff; --muted:#9da9c2; --blue:#5b8cff; --cyan:#29d8c7; --line:rgba(151,168,205,.17); --shadow:0 24px 70px rgba(0,0,0,.32); }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body { min-height:100vh; margin:0; overflow-x:hidden; background:radial-gradient(circle at 84% 12%,rgba(129,98,255,.13),transparent 30rem),radial-gradient(circle at 12% 88%,rgba(41,216,199,.09),transparent 30rem),var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.45; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.48; }
    .shell { width:min(1080px,calc(100% - 24px)); margin:auto; padding:10px 0 16px; }
    .topbar { min-height:54px; display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:9px; border-bottom:1px solid var(--line); }
    .brand { min-width:0; display:flex; align-items:center; gap:10px; }
    .brand-mark { width:34px; height:34px; flex:0 0 auto; display:grid; place-items:center; border:1px solid rgba(91,140,255,.38); border-radius:11px; background:rgba(91,140,255,.12); color:#aebdff; font-size:12px; font-weight:800; }
    .brand-name { color:var(--muted); font-size:11px; }
    .brand-title { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:760; }
    .back-link { color:var(--muted); font-size:13px; font-weight:680; text-decoration:none; }
    .back-link:hover { color:var(--text); }
    .btn:focus-visible,.back-link:focus-visible,.option:has(input:focus-visible) { outline:3px solid var(--cyan); outline-offset:3px; }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:20px; background:linear-gradient(145deg,var(--surface),rgba(12,15,25,.96)); box-shadow:var(--shadow); }
    .home { padding:clamp(20px,4vw,40px); }
    .eyebrow { margin:0 0 5px; color:var(--cyan); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(30px,5vw,48px); letter-spacing:-.045em; line-height:1.05; }
    .lead { max-width:760px; margin:10px 0 0; color:var(--muted); }
    .rules { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:18px 0; }
    .rule { padding:11px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); color:var(--muted); font-size:12px; }
    .rule strong { display:block; margin-bottom:3px; color:var(--text); font-size:13px; }
    .summary { margin-bottom:10px; color:var(--muted); font-size:13px; }
    .block-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .block-card { padding:14px; border:1px solid var(--line); border-radius:15px; background:rgba(14,18,29,.65); }
    .block-card.done { border-color:rgba(41,216,199,.34); background:rgba(25,63,63,.22); }
    .block-card.active { border-color:rgba(91,140,255,.5); }
    .block-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .block-name { font-weight:780; }
    .badge { padding:4px 8px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:10px; white-space:nowrap; }
    .block-score { min-height:38px; margin:8px 0; color:var(--muted); font-size:12px; }
    .card-actions { display:flex; flex-wrap:wrap; gap:7px; }
    .btn { min-height:40px; padding:9px 13px; border:1px solid transparent; border-radius:10px; background:linear-gradient(135deg,var(--blue),#765eff); color:white; font-weight:760; transition:transform .16s ease,filter .16s ease; }
    .btn:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.08); }
    .btn.secondary { border-color:var(--line); background:rgba(255,255,255,.04); color:var(--text); }
    .btn.full { width:100%; }
    .overall { margin-top:13px; padding:12px 13px; border:1px solid rgba(41,216,199,.22); border-radius:12px; background:rgba(41,216,199,.07); color:var(--muted); font-size:13px; }
    .overall strong { color:var(--text); }
    .test-view { min-height:min(700px,calc(100vh - 94px)); display:flex; flex-direction:column; }
    .test-head { padding:11px 16px 9px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.02); }
    .test-head-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .test-meta { color:var(--muted); font-size:12px; }
    .progress-track { height:4px; overflow:hidden; margin-top:8px; border-radius:999px; background:rgba(255,255,255,.06); }
    .progress-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--cyan)); }
    .question-wrap { flex:1; display:flex; flex-direction:column; padding:clamp(17px,3vw,30px); }
    .question-label { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    .word { margin:3px 0 0; font-size:clamp(34px,6vw,56px); letter-spacing:-.04em; line-height:1.05; overflow-wrap:anywhere; }
    .meaning { margin:3px 0 12px; color:var(--muted); font-size:14px; }
    .prompt { margin-bottom:8px; font-size:13px; font-weight:690; }
    .forms-head { display:grid; grid-template-columns:70px repeat(3,minmax(0,1fr)); gap:10px; padding:0 14px 7px; color:var(--muted); font:750 13px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-transform:uppercase; }
    .forms-head span:first-child { grid-column:2; }
    .options { display:grid; gap:10px; }
    .option { min-height:76px; display:grid; grid-template-columns:22px 28px minmax(0,1fr); align-items:center; gap:10px; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--surface-2); transition:border-color .15s ease,background .15s ease; }
    .option:hover { border-color:rgba(91,140,255,.5); }
    .option.selected { border-color:rgba(41,216,199,.56); background:rgba(41,216,199,.08); }
    .option input { width:20px; height:20px; margin:0; accent-color:var(--cyan); }
    .letter { color:var(--cyan); font-size:18px; font-weight:850; }
    .verb-forms { min-width:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; font:700 clamp(18px,2vw,21px)/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .verb-forms span { overflow-wrap:anywhere; }
    .nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; padding-top:14px; }
    .result { padding:clamp(22px,4vw,42px); text-align:center; }
    .result h2 { margin:5px 0 2px; font-size:clamp(27px,4vw,38px); }
    .subject { margin:0; color:var(--muted); font-size:13px; }
    .score { margin:13px 0 3px; color:#8cf4ea; font-size:clamp(42px,7vw,66px); font-weight:850; letter-spacing:-.05em; }
    .result-note { max-width:640px; margin:0 auto 16px; color:var(--muted); }
    .table-scroll { width:100%; overflow-x:auto; margin:16px auto; border:1px solid var(--line); border-radius:13px; }
    .result-table { width:100%; min-width:520px; border-collapse:collapse; text-align:left; }
    .result-table th,.result-table td { padding:9px 11px; border-bottom:1px solid var(--line); white-space:nowrap; }
    .result-table tr:last-child td { border-bottom:0; }
    .result-table th { color:var(--muted); font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
    .result-table td:nth-child(n+2),.result-table th:nth-child(n+2) { text-align:right; }
    .mistakes-review { margin:18px 0 0; padding:16px; border:1px solid rgba(255,183,92,.28); border-radius:14px; background:rgba(90,54,20,.18); text-align:left; }
    .mistakes-review h3 { margin:0 0 10px; font-size:17px; }
    .mistakes-review p { margin:0; color:var(--muted); }
    .mistake-list { display:grid; gap:8px; margin:0; padding:0; list-style:none; }
    .mistake-item { padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:rgba(10,13,22,.34); }
    .mistake-question { display:block; margin-bottom:3px; font-weight:760; }
    .mistake-answer { color:var(--muted); overflow-wrap:anywhere; }
    .result-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:16px; }
    .report-date { margin:13px 0 0; color:var(--muted); font-size:12px; }
    .footer { padding:11px 0 0; color:#71809b; font-size:11px; text-align:center; }
    @media (max-width:700px) {
      .shell { width:min(100% - 16px,1080px); padding-top:6px; }
      .topbar { min-height:46px; margin-bottom:6px; }
      .brand-name { display:none; }
      .brand-title { max-width:145px; font-size:13px; }
      .back-link { font-size:12px; }
      .panel { border-radius:17px; }
      .home { padding:18px 15px; }
      .rules,.block-grid { grid-template-columns:1fr; }
      .test-view { min-height:calc(100svh - 68px); }
      .test-head { padding:9px 12px 8px; }
      .test-head .btn { min-height:36px; padding:7px 9px; font-size:12px; }
      .question-wrap { padding:14px 12px; }
      .word { font-size:clamp(30px,10.2vw,38px); }
      .option { min-height:70px; grid-template-columns:20px 24px minmax(0,1fr); padding:12px 8px; gap:6px; }
      .option input { width:19px; height:19px; }
      .letter { font-size:16px; }
      .forms-head { grid-template-columns:56px repeat(3,minmax(0,1fr)); gap:6px; padding:0 8px 6px; font-size:12px; }
      .verb-forms { gap:6px; font-size:clamp(16px,4.7vw,18px); line-height:1.28; }
      .result { padding:20px 13px; }
    }
    @media print {
      :root { color-scheme:light; --text:#152033; --muted:#596477; --line:#d9dee8; }
      body { min-height:auto; background:white; color:var(--text); }
      .shell { width:100%; padding:0; }
      .topbar,.result-actions,.mistakes-review,.footer { display:none !important; }
      .panel { overflow:visible; border:0; border-radius:0; background:white; box-shadow:none; }
      .result { padding:10mm 8mm; }
      .score { color:#176b67; }
      .table-scroll { overflow:visible; }
      .result-table { min-width:0; }
      .result-table,.overall { break-inside:avoid; }
      .overall { background:#eef8f6; color:#354052; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <noscript><div class="shell"><div class="panel home">Для работы теста необходимо включить JavaScript в браузере.</div></div></noscript>
  <main class="shell" id="app" aria-live="polite"></main>
  <script>
    'use strict';
    const RAW_VERBS = [
      ['be','was / were','been','быть'],['become','became','become','становиться'],['begin','began','begun','начинать'],['break','broke','broken','ломать'],
      ['bring','brought','brought','приносить'],['build','built','built','строить'],['buy','bought','bought','покупать'],['catch','caught','caught','ловить'],
      ['choose','chose','chosen','выбирать'],['come','came','come','приходить'],['bite','bit','bitten','кусать'],['cut','cut','cut','резать'],
      ['do','did','done','делать'],['draw','drew','drawn','рисовать'],['drink','drank','drunk','пить'],['drive','drove','driven','водить'],
      ['eat','ate','eaten','есть'],['fall','fell','fallen','падать'],['feel','felt','felt','чувствовать'],['fight','fought','fought','бороться'],
      ['find','found','found','находить'],['fly','flew','flown','летать'],['forget','forgot','forgotten','забывать'],['get','got','got / gotten','получать'],
      ['give','gave','given','давать'],['go','went','gone','идти'],['grow','grew','grown','расти'],['have','had','had','иметь'],
      ['hear','heard','heard','слышать'],['hold','held','held','держать'],['keep','kept','kept','хранить'],['know','knew','known','знать'],
      ['leave','left','left','покидать'],['lend','lent','lent','одалживать'],['let','let','let','позволять'],['lose','lost','lost','терять'],
      ['make','made','made','делать, создавать'],['mean','meant','meant','означать'],['meet','met','met','встречать'],['pay','paid','paid','платить'],
      ['put','put','put','класть'],['freeze','froze','frozen','замерзать'],['ride','rode','ridden','ездить верхом'],['ring','rang','rung','звонить'],
      ['rise','rose','risen','подниматься'],['run','ran','run','бежать'],['say','said','said','говорить'],['see','saw','seen','видеть'],
      ['sell','sold','sold','продавать'],['send','sent','sent','отправлять'],['set','set','set','устанавливать'],['shake','shook','shaken','трясти'],
      ['shine','shone','shone','сиять'],['shoot','shot','shot','стрелять'],['show','showed','shown','показывать'],['shut','shut','shut','закрывать'],
      ['sing','sang','sung','петь'],['sit','sat','sat','сидеть'],['sleep','slept','slept','спать'],['speak','spoke','spoken','говорить'],
      ['spend','spent','spent','тратить'],['stand','stood','stood','стоять'],['steal','stole','stolen','красть'],['swim','swam','swum','плавать'],
      ['take','took','taken','брать'],['teach','taught','taught','обучать'],['tell','told','told','рассказывать'],['think','thought','thought','думать'],
      ['throw','threw','thrown','бросать'],['understand','understood','understood','понимать'],['wake','woke','woken','просыпаться'],['wear','wore','worn','носить'],
      ['win','won','won','выигрывать'],['write','wrote','written','писать'],['blow','blew','blown','дуть'],['strike','struck','struck','ударять'],
      ['dig','dug','dug','копать'],['feed','fed','fed','кормить'],['hide','hid','hidden','прятать'],['hit','hit','hit','ударять']
    ];

    function wrongForms(base, past, participle) {
      const regular = base + 'ed';
      if (past !== participle) return [[base, participle, participle], [base, base, past]];
      if (past !== base) return [[base, base, participle], [base, past, base]];
      return [[base, regular, regular], [base, regular, base]];
    }

    const TEST_DATA = { questions: RAW_VERBS.map(function (row, index) {
      const base = row[0], past = row[1], participle = row[2];
      const correct = [base, past, participle];
      const wrong = wrongForms(base, past, participle);
      const correctIndex = index % 3;
      const options = wrong.slice();
      options.splice(correctIndex, 0, correct);
      return { id:'irregular-' + String(index + 1).padStart(3,'0'), word:base, meaning:row[3], pos:'irregular', subtest:index < 40 ? 1 : 2, orderInSubtest:index % 40 + 1, options:options, correctIndex:correctIndex };
    }) };
    const CONFIG = { category:'irregular-verbs', title:'Неправильные глаголы', subtitle:'80 глаголов · 2 блока по 40', total:80 };
    const STORAGE_KEY = 'english-vocabulary-test-v3-' + CONFIG.category;
    const letters = ['A','B','C'];
    const app = document.getElementById('app');
    const blockNumbers = [1,2];

    function initialState() { return { version:3, completed:{}, active:null }; }
    function loadState() {
      try { const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (parsed && parsed.version === 3 && parsed.completed) return parsed; } catch (error) {}
      return initialState();
    }
    let state = loadState();
    function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) {} }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g,function (char) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]; }); }
    function shuffle(items) { const result=items.slice(); for(let index=result.length-1;index>0;index-=1){const target=Math.floor(Math.random()*(index+1));const temp=result[index];result[index]=result[target];result[target]=temp;} return result; }
    function pageFrame(content) { return '<div class="topbar"><div class="brand"><div class="brand-mark">EN</div><div><div class="brand-name">Английский язык</div><div class="brand-title">'+escapeHtml(CONFIG.title)+'</div></div></div><a class="back-link" href="/tests/english/">← К английским тестам</a></div><section class="panel">'+content+'</section><div class="footer">Автономный тест · результаты сохраняются в этом браузере</div>'; }
    function completedResults() { return blockNumbers.map(function(number){return state.completed[number];}).filter(Boolean); }
    function completedCount() { return completedResults().length; }
    function totalCompletedScore() { return completedResults().reduce(function(sum,result){return sum+result.score;},0); }
    function percent(score,total) { return total ? Math.round(score/total*100) : 0; }

    function renderHome() {
      const complete=completedCount(), allDone=complete===blockNumbers.length;
      const cards=blockNumbers.map(function(number){
        const result=state.completed[number], active=state.active&&state.active.block===number;
        const classes=['block-card']; if(result)classes.push('done'); if(active)classes.push('active');
        const label=active?'В процессе':result?'Завершён':'Не начат';
        let score=result?result.score+' из '+result.total+' правильных · '+result.percent+'%':'40 вопросов';
        if(active&&result)score+='<br>Сохранённый результат будет заменён после завершения.';
        let buttons='';
        if(active)buttons='<button class="btn full" data-continue="'+number+'">Продолжить</button>';
        else if(result)buttons='<button class="btn secondary" data-result="'+number+'">Результат</button><button class="btn" data-retry="'+number+'">Пройти заново</button>';
        else buttons='<button class="btn full" data-start="'+number+'">Начать</button>';
        return '<article class="'+classes.join(' ')+'"><div class="block-top"><div class="block-name">Блок '+number+'</div><span class="badge">'+label+'</span></div><div class="block-score">'+score+'</div><div class="card-actions">'+buttons+'</div></article>';
      }).join('');
      const completedScore=totalCompletedScore(), completedTotal=complete*40;
      let overall='';
      if(complete>0&&!allDone)overall='<div class="overall"><strong>Промежуточный результат:</strong> '+completedScore+' из '+completedTotal+' ('+percent(completedScore,completedTotal)+'%).<br>Завершено блоков: '+complete+' из 2. Это ещё не итог всего теста.</div>';
      if(allDone)overall='<div class="overall"><strong>Итог по всему тесту:</strong> '+completedScore+' из 80 ('+percent(completedScore,80)+'%).<br>Все блоки завершены.<br><button class="btn" id="open-final">Открыть итоговый результат</button></div>';
      const content='<div class="home"><div class="eyebrow">Английский язык</div><h1>'+escapeHtml(CONFIG.title)+'</h1><p class="lead">'+escapeHtml(CONFIG.subtitle)+'. Для каждого глагола выберите единственную правильную строку форм V1–V2–V3.</p><div class="rules"><div class="rule"><strong>Три формы</strong>Каждый вариант содержит V1, V2 и V3 одного глагола.</div><div class="rule"><strong>Разбор ошибок</strong>После блока показаны только ошибки и выбранные вами строки.</div><div class="rule"><strong>Повторное прохождение</strong>Любой блок можно пройти заново без потери другого результата.</div></div><div class="summary">Завершено блоков: '+complete+' из 2</div><div class="block-grid">'+cards+'</div>'+overall+'</div>';
      app.innerHTML=pageFrame(content);
      document.querySelectorAll('[data-start]').forEach(function(button){button.addEventListener('click',function(){startBlock(Number(button.dataset.start),false);});});
      document.querySelectorAll('[data-continue]').forEach(function(button){button.addEventListener('click',function(){startBlock(Number(button.dataset.continue),false);});});
      document.querySelectorAll('[data-retry]').forEach(function(button){button.addEventListener('click',function(){startBlock(Number(button.dataset.retry),true);});});
      document.querySelectorAll('[data-result]').forEach(function(button){button.addEventListener('click',function(){renderResult(Number(button.dataset.result));});});
      const finalButton=document.getElementById('open-final'); if(finalButton)finalButton.addEventListener('click',function(){renderResult(2);});
    }

    function startBlock(number,retry) {
      if(state.active&&state.active.block===number){renderQuestion();return;}
      if(state.completed[number]&&!retry){renderResult(number);return;}
      if(state.active&&!confirm('Другой блок ещё не завершён. Начать новый и удалить незавершённые ответы?'))return;
      const questions=shuffle(TEST_DATA.questions.filter(function(question){return question.subtest===number;}));
      state.active={block:number,index:0,questionIds:questions.map(function(question){return question.id;}),answers:{},startedAt:Date.now(),retry:Boolean(state.completed[number])};
      saveState(); renderQuestion();
    }
    function activeQuestions(){if(!state.active)return[];const byId=new Map(TEST_DATA.questions.map(function(question){return[question.id,question];}));return state.active.questionIds.map(function(id){return byId.get(id);}).filter(Boolean);}
    function formsText(forms){return forms.join(' — ');}

    function renderQuestion(){
      if(!state.active){renderHome();return;}
      const questions=activeQuestions(); if(!questions.length){state.active=null;saveState();renderHome();return;}
      const index=Math.max(0,Math.min(state.active.index,questions.length-1)); state.active.index=index;
      const question=questions[index],selected=state.active.answers[question.id];
      const options=question.options.map(function(option,optionIndex){const checked=selected===optionIndex;return '<label class="option '+(checked?'selected':'')+'"><input type="radio" name="answer" value="'+optionIndex+'" '+(checked?'checked':'')+'><span class="letter">'+letters[optionIndex]+'.</span><span class="verb-forms">'+option.map(function(form){return '<span>'+escapeHtml(form)+'</span>';}).join('')+'</span></label>';}).join('');
      const progress=Math.round((index+1)/questions.length*100),isLast=index===questions.length-1;
      const content='<div class="test-view"><div class="test-head"><div class="test-head-row"><div><strong>Блок '+state.active.block+'</strong><div class="test-meta">Вопрос '+(index+1)+' из '+questions.length+(state.active.retry?' · повторное прохождение':'')+'</div></div><button class="btn secondary" id="to-home">К блокам</button></div><div class="progress-track"><div class="progress-fill" style="width:'+progress+'%"></div></div></div><div class="question-wrap"><div class="question-label">Неправильный глагол</div><h2 class="word">'+escapeHtml(question.word)+'</h2><div class="meaning">'+escapeHtml(question.meaning)+'</div><div class="prompt">Выберите правильную строку:</div><div class="forms-head"><span>V1</span><span>V2</span><span>V3</span></div><div class="options">'+options+'</div><div class="nav"><button class="btn secondary" id="previous" '+(index===0?'disabled':'')+'>Назад</button><button class="btn" id="next" '+(selected===undefined?'disabled':'')+'>'+(isLast?'Завершить блок':'Следующий вопрос')+'</button></div></div></div>';
      app.innerHTML=pageFrame(content);
      document.getElementById('to-home').addEventListener('click',renderHome);
      document.getElementById('previous').addEventListener('click',function(){state.active.index-=1;saveState();renderQuestion();});
      document.querySelectorAll('input[name="answer"]').forEach(function(input){input.addEventListener('change',function(){state.active.answers[question.id]=Number(input.value);saveState();renderQuestion();});});
      document.getElementById('next').addEventListener('click',function(){if(state.active.answers[question.id]===undefined)return;if(isLast)finishBlock();else{state.active.index+=1;saveState();renderQuestion();}});
    }

    function finishBlock(){
      const active=state.active,questions=activeQuestions(),unanswered=questions.filter(function(question){return active.answers[question.id]===undefined;});
      if(unanswered.length){alert('Остались вопросы без ответа: '+unanswered.length+'.');state.active.index=questions.findIndex(function(question){return active.answers[question.id]===undefined;});saveState();renderQuestion();return;}
      const score=questions.reduce(function(sum,question){return sum+(active.answers[question.id]===question.correctIndex?1:0);},0),number=active.block;
      state.completed[number]={score:score,total:questions.length,percent:percent(score,questions.length),completedAt:new Date().toISOString(),durationSeconds:Math.max(1,Math.round((Date.now()-active.startedAt)/1000)),mistakes:questions.filter(function(question){return active.answers[question.id]!==question.correctIndex;}).map(function(question){return{question:question.word,selected:formsText(question.options[active.answers[question.id]])};})};
      state.active=null;saveState();renderResult(number);
    }
    function formatDuration(seconds){const minutes=Math.floor(seconds/60);return minutes+' мин '+(seconds%60)+' сек';}
    function reportDate(){return new Date().toLocaleString('ru-RU');}
    function resultRows(){return blockNumbers.map(function(number){const result=state.completed[number];if(!result)return'';return '<tr><td>Блок '+number+'</td><td>'+result.score+' из '+result.total+'</td><td>'+result.percent+'%</td><td>'+formatDuration(result.durationSeconds)+'</td></tr>';}).join('');}
    function mistakesReview(result){
      if(!Array.isArray(result.mistakes))return '<section class="mistakes-review"><h3>Ошибки в этом блоке</h3><p>Для ранее сохранённого результата перечень ошибок недоступен. Он появится после повторного прохождения блока.</p></section>';
      if(!result.mistakes.length)return '<section class="mistakes-review"><h3>Ошибки в этом блоке</h3><p>Ошибок нет — все ответы верны.</p></section>';
      const items=result.mistakes.map(function(mistake){return '<li class="mistake-item"><span class="mistake-question">'+escapeHtml(mistake.question)+'</span><span class="mistake-answer">Ваш ответ: '+escapeHtml(mistake.selected)+'</span></li>';}).join('');
      return '<section class="mistakes-review"><h3>Ошибки в блоке: '+result.mistakes.length+'</h3><ul class="mistake-list">'+items+'</ul></section>';
    }

    function renderResult(number){
      const result=state.completed[number];if(!result){renderHome();return;}
      const complete=completedCount(),allDone=complete===2,totalScore=totalCompletedScore(),currentTotal=complete*40,totalPercent=percent(totalScore,allDone?80:currentTotal);
      const heading=allDone?'Итоговый результат':'Блок '+number+' завершён',score=allDone?totalScore+' / 80':result.score+' / '+result.total;
      const note=allDone?totalPercent+'% по всему тесту. Результаты учитывают последние завершённые попытки каждого блока.':result.percent+'% в блоке '+number+'. Ниже показан промежуточный результат только по завершённым блокам.';
      const overall=allDone?'<div class="overall"><strong>Общий результат:</strong> '+totalScore+' из 80 ('+totalPercent+'%).</div>':'<div class="overall"><strong>Промежуточный результат:</strong> '+totalScore+' из '+currentTotal+' ('+totalPercent+'%).<br>Завершено блоков: '+complete+' из 2. Это ещё не итог всего теста.</div>';
      const printAction=allDone?'<button class="btn" id="print">Сохранить итог в PDF</button>':'';
      const content='<div class="result"><div class="eyebrow">'+heading+'</div><h2>'+escapeHtml(CONFIG.title)+'</h2><p class="subject">Предмет: Английский язык</p><div class="score">'+score+'</div><p class="result-note">'+note+'</p><div class="table-scroll"><table class="result-table"><thead><tr><th>Раздел</th><th>Правильные ответы</th><th>Процент</th><th>Время</th></tr></thead><tbody>'+resultRows()+'</tbody></table></div>'+overall+mistakesReview(result)+'<div class="result-actions"><button class="btn secondary" id="home">К списку блоков</button><button class="btn secondary" id="retry">Пройти блок '+number+' заново</button>'+printAction+'</div><p class="report-date">Дата формирования отчёта: <span id="report-date">'+escapeHtml(reportDate())+'</span></p></div>';
      app.innerHTML=pageFrame(content);
      document.getElementById('home').addEventListener('click',renderHome);
      document.getElementById('retry').addEventListener('click',function(){startBlock(number,true);});
      if(allDone)document.getElementById('print').addEventListener('click',function(){document.getElementById('report-date').textContent=reportDate();window.print();});
    }
    document.addEventListener('keydown',function(event){if(!state.active)return;if(['1','2','3','a','b','c','A','B','C'].includes(event.key)){const lookup={'1':0,'a':0,'A':0,'2':1,'b':1,'B':1,'3':2,'c':2,'C':2};const input=document.querySelector('input[name="answer"][value="'+lookup[event.key]+'"]');if(input){input.checked=true;input.dispatchEvent(new Event('change',{bubbles:true}));}}});
    renderHome();
  </script>
</body>
</html>
