<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Тест по английскому языку: Прилагательные и наречия.">
  <meta name="theme-color" content="#090b12">
  <title>Прилагательные и наречия — тест по английскому языку</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --surface: rgba(20, 24, 37, .96);
      --surface-soft: rgba(28, 34, 52, .78);
      --surface-hover: rgba(35, 43, 65, .9);
      --text: #f4f7ff;
      --muted: #9da9c2;
      --line: rgba(151, 168, 205, .18);
      --blue: #5b8cff;
      --violet: #8162ff;
      --cyan: #29d8c7;
      --cyan-soft: rgba(41, 216, 199, .12);
      --shadow: 0 22px 64px rgba(0, 0, 0, .32);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(91, 140, 255, .14), transparent 30rem),
        radial-gradient(circle at 100% 100%, rgba(41, 216, 199, .1), transparent 32rem),
        var(--bg);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, .option:focus-within {
      outline: 3px solid rgba(41, 216, 199, .55);
      outline-offset: 3px;
    }

    .shell { width: min(1080px, calc(100% - 28px)); margin: 0 auto; padding: 12px 0 20px; }
    .topbar { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center;
      border: 1px solid rgba(133, 149, 255, .35); border-radius: 11px;
      background: linear-gradient(145deg, rgba(91, 140, 255, .18), rgba(129, 98, 255, .08));
      color: #aebdff; font-size: .72rem; font-weight: 800;
    }
    .brand-name { color: var(--muted); font-size: 12px; }
    .brand-title { overflow-wrap: anywhere; font-weight: 750; line-height: 1.15; }
    .back-link { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .back-link:hover { color: var(--text); }

    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 21px; background: var(--surface); box-shadow: var(--shadow); }
    .home { padding: clamp(20px, 3.3vw, 34px); }
    .eyebrow { color: var(--cyan); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 7px 0 8px; font-size: clamp(28px, 4vw, 42px); line-height: 1.04; letter-spacing: -.04em; }
    .lead { max-width: none; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.48; }
    .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0; }
    .rule { padding: 11px 12px; border: 1px solid rgba(151, 168, 205, .1); border-radius: 13px; background: var(--surface-soft); color: var(--muted); font-size: 12px; line-height: 1.38; }
    .rule strong { display: block; margin-bottom: 2px; color: var(--text); font-size: 13px; }
    .summary { margin-bottom: 10px; color: var(--muted); font-size: 13px; }
    .block-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 10px; }
    .block-card { border: 1px solid var(--line); border-radius: 15px; padding: 14px; background: rgba(14, 18, 29, .65); }
    .block-card.done { border-color: rgba(41, 216, 199, .34); background: rgba(25, 63, 63, .22); }
    .block-card.active { border-color: rgba(91, 140, 255, .5); }
    .block-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .block-name { font-weight: 800; }
    .badge { padding: 4px 7px; border-radius: 999px; background: rgba(255, 255, 255, .06); color: var(--muted); font-size: 10px; white-space: nowrap; }
    .done .badge { background: var(--cyan-soft); color: #7ff1e6; }
    .active .badge { background: rgba(91, 140, 255, .14); color: #afc4ff; }
    .block-score { min-height: 38px; margin: 10px 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 7px; }

    .btn {
      min-height: 40px; border: 0; border-radius: 11px; padding: 9px 12px;
      background: linear-gradient(135deg, var(--blue), var(--violet)); color: white; font-weight: 750;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn.secondary { border: 1px solid var(--line); background: rgba(255, 255, 255, .035); color: var(--text); }
    .btn.secondary:hover { background: var(--surface-hover); }
    .btn:disabled { cursor: not-allowed; opacity: .42; transform: none; }
    .btn.full { width: 100%; }

    .overall { margin-top: 16px; border: 1px solid rgba(41, 216, 199, .3); border-radius: 15px; padding: 14px; background: var(--cyan-soft); color: #cbd8e9; font-size: 14px; line-height: 1.5; }
    .overall strong { color: #8cf4ea; }
    .overall .btn { margin-top: 10px; }

    .test-view { min-height: min(620px, calc(100svh - 92px)); display: flex; flex-direction: column; }
    .test-head { padding: 12px 18px 9px; border-bottom: 1px solid var(--line); background: rgba(12, 15, 25, .82); }
    .test-head-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .test-meta { color: var(--muted); font-size: 12px; }
    .progress-track { height: 5px; overflow: hidden; margin-top: 8px; border-radius: 999px; background: rgba(255, 255, 255, .08); }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .2s ease; }
    .question-wrap { flex: 1; display: flex; flex-direction: column; padding: clamp(16px, 2.7vw, 26px); }
    .question-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .word { max-width: 100%; margin: 6px 0 3px; overflow-wrap: anywhere; font-size: clamp(32px, 5.2vw, 52px); letter-spacing: -.035em; line-height: 1.02; }
    .pos { color: var(--cyan); font-size: 12px; font-weight: 750; }
    .prompt { margin: 10px 0 8px; color: var(--muted); font-size: 13px; }
    .options { display: grid; gap: 8px; }
    .option {
      min-width: 0; min-height: 50px; display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--line); border-radius: 13px; padding: 9px 12px;
      background: rgba(255, 255, 255, .025); transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .option:hover { border-color: rgba(41, 216, 199, .46); transform: translateY(-1px); }
    .option.selected { border-color: var(--cyan); background: var(--cyan-soft); }
    .option input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--cyan); }
    .letter { width: 22px; flex: 0 0 auto; color: var(--cyan); font-weight: 850; }
    .option-text { min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 14px; }

    .result { padding: clamp(22px, 4vw, 42px); text-align: center; }
    .result h2 { margin: 5px 0 2px; overflow-wrap: anywhere; font-size: clamp(27px, 4vw, 38px); }
    .subject { margin: 0; color: var(--muted); font-size: 13px; }
    .score { margin: 13px 0 3px; color: #8cf4ea; font-size: clamp(42px, 7vw, 66px); font-weight: 850; letter-spacing: -.05em; }
    .result-note { max-width: 640px; margin: 0 auto 16px; color: var(--muted); line-height: 1.45; }
    .table-scroll { width: 100%; overflow-x: auto; margin: 16px auto; border: 1px solid var(--line); border-radius: 13px; }
    .result-table { width: 100%; min-width: 520px; border-collapse: collapse; text-align: left; }
    .result-table th, .result-table td { padding: 9px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .result-table tr:last-child td { border-bottom: 0; }
    .result-table th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .result-table td:nth-child(n+2), .result-table th:nth-child(n+2) { text-align: right; }
    .mistakes-review { margin: 18px 0 0; padding: 16px; border: 1px solid rgba(255, 183, 92, .28); border-radius: 14px; background: rgba(90, 54, 20, .18); text-align: left; }
    .mistakes-review h3 { margin: 0 0 10px; font-size: 17px; }
    .mistakes-review p { margin: 0; color: var(--muted); }
    .mistake-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .mistake-item { padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: rgba(10, 13, 22, .34); }
    .mistake-question { display: block; margin-bottom: 3px; font-weight: 760; overflow-wrap: anywhere; }
    .mistake-answer { color: var(--muted); overflow-wrap: anywhere; }
    .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
    .report-date { margin: 13px 0 0; color: var(--muted); font-size: 12px; }
    .footer { padding: 11px 0 0; color: #71809b; font-size: 11px; text-align: center; }

    @media (max-width: 700px) {
      .shell { width: min(100% - 16px, 1080px); padding-top: 6px; }
      .topbar { min-height: 46px; margin-bottom: 6px; }
      .brand-name { display: none; }
      .brand-title { max-width: 145px; font-size: 13px; }
      .back-link { font-size: 12px; }
      .panel { border-radius: 17px; }
      .home { padding: 18px 15px; }
      h1 { font-size: clamp(27px, 8.8vw, 34px); }
      .lead { font-size: 14px; }
      .rules { grid-template-columns: 1fr; gap: 7px; margin: 14px 0; }
      .rule { padding: 9px 10px; }
      .block-grid { grid-template-columns: 1fr; }
      .test-view { min-height: calc(100svh - 68px); }
      .test-head { padding: 9px 12px 8px; }
      .test-head .btn { min-height: 36px; padding: 7px 9px; font-size: 12px; }
      .question-wrap { padding: 14px 12px; }
      .word { font-size: clamp(30px, 10.2vw, 38px); }
      .option { min-height: 52px; padding: 9px 10px; }
      .nav { padding-top: 11px; }
      .result { padding: 20px 13px; }
      .score { font-size: clamp(40px, 14vw, 56px); }
      .table-scroll { margin: 14px auto; }
    }

    @media (min-width: 701px) and (max-height: 768px) {
      .shell { padding-top: 6px; }
      .topbar { min-height: 44px; margin-bottom: 6px; }
      .test-view { min-height: calc(100vh - 74px); }
      .question-wrap { padding: 14px 22px; }
      .word { font-size: 42px; }
      .option { min-height: 46px; padding: 8px 12px; }
      .nav { padding-top: 9px; }
    }

    @media print {
      :root { color-scheme: light; --text: #152033; --muted: #596477; --line: #d9dee8; --cyan: #176b67; --cyan-soft: #e7f4f2; }
      body { min-height: auto; background: white; color: var(--text); }
      .shell { width: 100%; padding: 0; }
      .topbar, .result-actions, .mistakes-review, .footer { display: none !important; }
      .panel { overflow: visible; border: 0; border-radius: 0; background: white; box-shadow: none; }
      .result { padding: 10mm 8mm; }
      .score { color: #176b67; }
      .table-scroll { overflow: visible; border-color: var(--line); }
      .result-table { min-width: 0; }
      .result-table, .overall { break-inside: avoid; }
      .overall { background: #eef8f6; color: #354052; }
      .overall strong { color: #0f514e; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

    const CONFIG = { category: 'modifiers', title: 'Прилагательные и наречия', subtitle: '320 вопросов · 8 блоков по 40 · зеркальные вопросы EN → RU и RU → EN', total: 320 };
    const STORAGE_KEY = 'english-vocabulary-test-v3-' + CONFIG.category;
    const ORIGINAL_BLOCKS = 4;
    const letters = ['A', 'B', 'C'];
    const app = document.getElementById('app');
    const blockNumbers = [...new Set(TEST_DATA.questions.map(function (question) { return question.subtest; }))].sort(function (a, b) { return a - b; });

    function initialState() {
      return { version: 3, completed: {}, active: null };
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (parsed && parsed.version === 3 && parsed.completed) return parsed;
      } catch (error) {}
      return initialState();
    }

    let state = loadState();

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) {}
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char];
      });
    }

    function shuffle(items) {
      const result = items.slice();
      for (let index = result.length - 1; index > 0; index -= 1) {
        const target = Math.floor(Math.random() * (index + 1));
        const temp = result[index]; result[index] = result[target]; result[target] = temp;
      }
      return result;
    }

    function pageFrame(content) {
      return '<div class="topbar">' +
        '<div class="brand"><div class="brand-mark">EN</div><div><div class="brand-name">Английский язык</div><div class="brand-title">' + escapeHtml(CONFIG.title) + '</div></div></div>' +
        '<a class="back-link" href="/tests/english/">← К английским тестам</a></div>' +
        '<section class="panel">' + content + '</section>' +
        '<div class="footer">Автономный тест · результаты сохраняются в этом браузере</div>';
    }

    function completedResults() {
      return blockNumbers.map(function (number) { return state.completed[number]; }).filter(Boolean);
    }

    function completedCount() { return completedResults().length; }

    function totalCompletedScore() {
      return completedResults().reduce(function (sum, result) { return sum + result.score; }, 0);
    }

    function percent(score, total) {
      return total ? Math.round(score / total * 100) : 0;
    }

    function renderHome() {
      const complete = completedCount();
      const allDone = complete === blockNumbers.length;
      const cards = blockNumbers.map(function (number) {
        const result = state.completed[number];
        const active = state.active && state.active.block === number;
        const classes = ['block-card'];
        if (result) classes.push('done');
        if (active) classes.push('active');
        const label = active ? 'В процессе' : result ? 'Завершён' : 'Не начат';
        let score = '40 вопросов';
        if (result) score = result.score + ' из ' + result.total + ' правильных · ' + result.percent + '%';
        if (active && result) score += '<br>Сохранённый результат будет заменён после завершения.';
        let buttons = '';
        if (active) {
          buttons = '<button class="btn full" data-continue="' + number + '">Продолжить</button>';
        } else if (result) {
          buttons = '<button class="btn secondary" data-result="' + number + '">Результат</button><button class="btn" data-retry="' + number + '">Пройти заново</button>';
        } else {
          buttons = '<button class="btn full" data-start="' + number + '">Начать</button>';
        }
        return '<article class="' + classes.join(' ') + '"><div class="block-top"><div class="block-name">Блок ' + number + (number > ORIGINAL_BLOCKS ? ' · RU → EN' : ' · EN → RU') + '</div><span class="badge">' + label + '</span></div>' +
          '<div class="block-score">' + score + '</div><div class="card-actions">' + buttons + '</div></article>';
      }).join('');

      const completedTotal = complete * 40;
      const completedScore = totalCompletedScore();
      let overall = '';
      if (complete > 0 && !allDone) {
        overall = '<div class="overall"><strong>Промежуточный результат:</strong> ' + completedScore + ' из ' + completedTotal + ' (' + percent(completedScore, completedTotal) + '%).<br>Завершено блоков: ' + complete + ' из ' + blockNumbers.length + '. Это ещё не итог всего теста.</div>';
      }
      if (allDone) {
        overall = '<div class="overall"><strong>Итог по всему тесту:</strong> ' + completedScore + ' из ' + TEST_DATA.questions.length + ' (' + percent(completedScore, TEST_DATA.questions.length) + '%).<br>Все блоки завершены.<br><button class="btn" id="open-final">Открыть итоговый результат</button></div>';
      }

      const content = '<div class="home"><div class="eyebrow">Английский язык</div><h1>' + escapeHtml(CONFIG.title) + '</h1>' +

        '<div class="rules"><div class="rule"><strong>Один ответ</strong>В каждом вопросе верен один из трёх вариантов.</div>' +

      document.querySelectorAll('[data-continue]').forEach(function (button) {

        button.addEventListener('click', function () { renderResult(Number(button.dataset.result)); });
      });
      const finalButton = document.getElementById('open-final');
      if (finalButton) finalButton.addEventListener('click', function () { renderResult(blockNumbers[blockNumbers.length - 1]); });
    }

    function startBlock(number, retry) {
      if (state.active && state.active.block === number) { renderQuestion(); return; }
      if (state.completed[number] && !retry) { renderResult(number); return; }
      if (state.active && !confirm('Другой блок ещё не завершён. Начать новый и удалить незавершённые ответы?')) return;
      const questions = shuffle(TEST_DATA.questions.filter(function (question) { return question.subtest === number; }));
      state.active = {
        block: number,
        index: 0,
        questionIds: questions.map(function (question) { return question.id; }),
        answers: {},
        startedAt: Date.now(),
        retry: Boolean(state.completed[number])
      };
      saveState();
      renderQuestion();
    }

    function activeQuestions() {
      if (!state.active) return [];
      const byId = new Map(TEST_DATA.questions.map(function (question) { return [question.id, question]; }));
      return state.active.questionIds.map(function (id) { return byId.get(id); }).filter(Boolean);
    }

    function posText(pos) {
      if (pos === 'verb') return 'глагол';
      if (pos === 'noun') return 'существительное';
      if (pos === 'adjective') return 'прилагательное';
      if (pos === 'adverb') return 'наречие';
      return '';
    }

    function renderQuestion() {
      if (!state.active) { renderHome(); return; }
      const questions = activeQuestions();
      if (!questions.length) { state.active = null; saveState(); renderHome(); return; }
      const index = Math.max(0, Math.min(state.active.index, questions.length - 1));

      const selected = state.active.answers[question.id];

        const checked = selected === optionIndex;

      const isLast = index === questions.length - 1;

        '<div class="prompt">Отметьте один вариант:</div><div class="options">' + options + '</div><div class="nav"><button class="btn secondary" id="previous" ' + (index === 0 ? 'disabled' : '') + '>Назад</button>' +
        '<button class="btn" id="next" ' + (selected === undefined ? 'disabled' : '') + '>' + (isLast ? 'Завершить блок' : 'Следующий вопрос') + '</button></div></div></div>';
      app.innerHTML = pageFrame(content);

      document.getElementById('to-home').addEventListener('click', renderHome);
      document.getElementById('previous').addEventListener('click', function () { state.active.index -= 1; saveState(); renderQuestion(); });
      document.querySelectorAll('input[name="answer"]').forEach(function (input) {
        input.addEventListener('change', function () {
          state.active.answers[question.id] = Number(input.value);

        if (state.active.answers[question.id] === undefined) return;

        else { state.active.index += 1; saveState(); renderQuestion(); }
      });

    function finishBlock() {
      const active = state.active;
      const questions = activeQuestions();
      const unanswered = questions.filter(function (question) { return active.answers[question.id] === undefined; });
      if (unanswered.length) {
        alert('Остались вопросы без ответа: ' + unanswered.length + '.');
        state.active.index = questions.findIndex(function (question) { return active.answers[question.id] === undefined; });

      }
      const score = questions.reduce(function (sum, question) {
        return sum + (active.answers[question.id] === question.correctIndex ? 1 : 0);
      }, 0);
      const number = active.block;
      state.completed[number] = {
        score: score,
        total: questions.length,
        percent: percent(score, questions.length),
        completedAt: new Date().toISOString(),
        durationSeconds: Math.max(1, Math.round((Date.now() - active.startedAt) / 1000)),

        })
      };
      state.active = null;
      saveState();
      renderResult(number);
    }

    function formatDuration(seconds) {
      const minutes = Math.floor(seconds / 60);

        const result = state.completed[number];
        if (!result) return '';
        return '<tr><td>Блок ' + number + '</td><td>' + result.score + ' из ' + result.total + '</td><td>' + result.percent + '%</td><td>' + formatDuration(result.durationSeconds) + '</td></tr>';
      }).join('');
    }

    function mistakesReview(result) {
      if (!Array.isArray(result.mistakes)) {
        return '<section class="mistakes-review"><h3>Ошибки в этом блоке</h3><p>Для ранее сохранённого результата перечень ошибок недоступен. Он появится после повторного прохождения блока.</p></section>';
      }
      if (!result.mistakes.length) {
        return '<section class="mistakes-review"><h3>Ошибки в этом блоке</h3><p>Ошибок нет — все ответы верны.</p></section>';
      }
      const items = result.mistakes.map(function (mistake) {
        return '<li class="mistake-item"><span class="mistake-question">' + escapeHtml(mistake.question) + '</span><span class="mistake-answer">Ваш ответ: ' + escapeHtml(mistake.selected) + '</span></li>';
      }).join('');
      return '<section class="mistakes-review"><h3>Ошибки в блоке: ' + result.mistakes.length + '</h3><ul class="mistake-list">' + items + '</ul></section>';
    }

    function renderResult(number) {
      const result = state.completed[number];
      if (!result) { renderHome(); return; }
      const complete = completedCount();
      const allDone = complete === blockNumbers.length;
      const totalScore = totalCompletedScore();
      const currentTotal = complete * 40;
      const totalPercent = percent(totalScore, allDone ? TEST_DATA.questions.length : currentTotal);
      const heading = allDone ? 'Итоговый результат' : 'Блок ' + number + ' завершён';
      const score = allDone ? totalScore + ' / ' + TEST_DATA.questions.length : result.score + ' / ' + result.total;
      const note = allDone
        ? totalPercent + '% по всему тесту. Результаты учитывают последние завершённые попытки каждого блока.'
        : result.percent + '% в блоке ' + number + '. Ниже показан промежуточный результат только по завершённым блокам.';
      const overall = allDone
        ? '<div class="overall"><strong>Общий результат:</strong> ' + totalScore + ' из ' + TEST_DATA.questions.length + ' (' + totalPercent + '%).</div>'
        : '<div class="overall"><strong>Промежуточный результат:</strong> ' + totalScore + ' из ' + currentTotal + ' (' + totalPercent + '%).<br>Завершено блоков: ' + complete + ' из ' + blockNumbers.length + '. Это ещё не итог всего теста.</div>';
      const printAction = allDone ? '<button class="btn" id="print">Сохранить итог в PDF</button>' : '';
      const content = '<div class="result"><div class="eyebrow">' + heading + '</div><h2>' + escapeHtml(CONFIG.title) + '</h2><p class="subject">Предмет: Английский язык</p>' +
        '<div class="score">' + score + '</div><p class="result-note">' + note + '</p>' +
        '<div class="table-scroll"><table class="result-table"><thead><tr><th>Раздел</th><th>Правильные ответы</th><th>Процент</th><th>Время</th></tr></thead><tbody>' + resultRows() + '</tbody></table></div>' + overall + mistakesReview(result) +
        '<div class="result-actions"><button class="btn secondary" id="home">К списку блоков</button><button class="btn secondary" id="retry">Пройти блок ' + number + ' заново</button>' + printAction + '</div>' +
        '<p class="report-date">Дата формирования отчёта: <span id="report-date">' + escapeHtml(reportDate()) + '</span></p></div>';
      app.innerHTML = pageFrame(content);
      document.getElementById('home').addEventListener('click', renderHome);
      document.getElementById('retry').addEventListener('click', function () { startBlock(number, true); });
      if (allDone) {
        document.getElementById('print').addEventListener('click', function () {
          document.getElementById('report-date').textContent = reportDate();
          window.print();
        });
      }
    }

    document.addEventListener('keydown', function (event) {
      if (!state.active) return;
      if (['1', '2', '3', 'a', 'b', 'c', 'A', 'B', 'C'].includes(event.key)) {
        const lookup = { '1': 0, 'a': 0, 'A': 0, '2': 1, 'b': 1, 'B': 1, '3': 2, 'c': 2, 'C': 2 };
        const input = document.querySelector('input[name="answer"][value="' + lookup[event.key] + '"]');
        if (input) { input.checked = true; input.dispatchEvent(new Event('change', { bubbles: true })); }
      }
    });

    renderHome();
  </script>
</body>
</html>
